<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>colibre.fr — page introuvable</title>
    <style>
      @import url(https://fonts.bunny.net/css?family=fira-code:400|inter:400,600);

      :root {
        --primary-color: rgb(179, 56, 33);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Inter", sans-serif;
        font-weight: 400;
        background-color: rgb(255 240 240 / 40%);
        -moz-osx-font-smoothing: grayscale;
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      header {
        padding: 20px 24px;
        border-bottom: 1px solid #eee;
        background: #fff;
      }

      .logo-wrapper {
        display: flex;
        align-items: baseline;
        gap: 12px;
      }

      a.logo {
        color: black;
        text-decoration: none;
      }

      a.logo h1 {
        font-weight: 400;
        font-size: 1.5rem;
        line-height: 1;
      }

      a.logo h1 span {
        color: var(--primary-color);
      }

      p.version {
        font-family: "Fira Code", monospace;
        font-size: 0.85rem;
        color: #666;
      }

      main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 48px 24px;
      }

      .card {
        background: #fff;
        border: 1px solid #e5e5e5;
        border-radius: 6px;
        padding: 40px 48px;
        max-width: 520px;
        width: 100%;
        text-align: center;
      }

      .card h2 {
        font-weight: 600;
        font-size: 1.25rem;
        color: var(--primary-color);
        margin-bottom: 16px;
      }

      .card p {
        color: #444;
        line-height: 1.6;
        margin-bottom: 10px;
      }

      .card ul {
        list-style: none;
        margin-top: 24px;
        display: flex;
        gap: 24px;
        justify-content: center;
      }

      .card ul a {
        color: var(--primary-color);
        font-weight: 600;
        text-decoration: none;
      }

      .card ul a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo-wrapper">
        <a class="logo" href="/">
          <h1>colibre</h1>
        </a>
      </div>
    </header>

    <main>
      <div class="card">
        <h2>Page introuvable</h2>
        <p>
          Cette adresse ne correspond à aucune page de colibre. Elle a peut-être
          été supprimée, ou provient d'un lien devenu obsolète.
        </p>
        <ul>
          <li><a href="/">Rechercher un acheteur</a></li>
          <li><a href="/tableau">Explorer les marchés</a></li>
        </ul>
      </div>
    </main>
  </body>
</html>
