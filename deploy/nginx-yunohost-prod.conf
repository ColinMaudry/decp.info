location / {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    # Sans cet en-tête, Flask croit servir en http derrière le proxy : le
    # canonical et og:url sortiraient en http://colibre.fr/..., c'est-à-dire
    # vers des URLs qui redirigent. `ProxyFix(x_proto=1)` dans src/app.py le lit.
    # `X-Forwarded-Host` n'est volontairement PAS posé : `Host $host` suffit, et
    # ProxyFix est configuré avec x_host=0 pour ne pas faire confiance à un
    # en-tête que le client pourrait forger.
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:46820;
    client_max_body_size 100M;
    add_header Link "<$scheme://$host$uri>; rel=\"canonical\"";
    add_header Access-Control-Allow-Origin *;
}

error_page 500 502 503 504 /5xx.html;

location = /5xx.html {
    root /var/www/colibre/src/assets;
    internal;
}
