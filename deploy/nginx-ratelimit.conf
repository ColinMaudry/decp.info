# Limitation de débit par adresse IP.
#
# À déposer dans /etc/nginx/conf.d/ratelimit.conf — à la RACINE de conf.d, et
# non dans le sous-dossier du domaine : `limit_req_zone` n'est valide qu'en
# contexte http, alors que /etc/nginx/conf.d/<domaine>.d/ est inclus dans un
# bloc server. Même contrainte que pour un bloc `geo`.
#
# Le débit soutenu est ce qui distingue un visiteur d'un crawler : un humain
# émet des rafales courtes séparées de longues pauses, un robot maintient une
# charge constante. D'où un débit moyen modeste associé à une rafale généreuse.
#
# Calibré sur le log d'accès du 2026-07-30, après blocage des plages Baidu :
#   - pic maximal sur 1 s      : 49 r/s  (chargement d'une page Dash)
#   - débit soutenu maximal    : 3,85 r/s
# `rate` laisse donc ~30 % de marge au visiteur le plus actif observé, et
# `burst` vaut le double du pic maximal, de quoi absorber deux chargements
# simultanés sans gêner personne.
#
# L'API et le serveur MCP sont exemptés : ce sont des fonctionnalités payantes,
# et limiter par IP y est le mauvais instrument — plusieurs abonnés derrière un
# même NAT partageraient le compteur, et un agent MCP un peu bavard se ferait
# couper sans raison. Leur limitation relève du quota par jeton prévu par #123.
# Une clé vide désactive la limitation pour la requête concernée.
map $request_uri $cle_limite {
    default    $binary_remote_addr;
    ~^/_mcp    "";
    ~^/api/    "";
}

# 10 Mo de zone mémorisent environ 160 000 adresses.
limit_req_zone $cle_limite zone=colibre:10m rate=5r/s;

# 429 plutôt que le 503 par défaut : c'est le code que les crawlers
# interprètent comme « ralentis », et il n'est pas confondu avec une panne.
limit_req_status 429;
