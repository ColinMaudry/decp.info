# Vhost YunoHost de test.colibre.fr (branche `dev`, déployée automatiquement).
#
# À déposer dans /etc/nginx/conf.d/test.colibre.fr.d/colibre.conf
#
# DEUX VALEURS À RENSEIGNER AVANT DE RECHARGER NGINX. Elles sont laissées en
# marqueurs volontairement : `nginx -t` échouera tant qu'elles sont là, ce qui
# vaut mieux qu'un port erroné qui servirait silencieusement une autre
# application YunoHost sous test.colibre.fr.
#
#   __PORT_TEST__       port de l'app de test  → yunohost app setting <app> port
#   __CHEMIN_APP_TEST__ racine de l'install    → yunohost app map
#
# Différences avec deploy/nginx-yunohost-prod.conf : ces deux valeurs, et
# l'en-tête X-Robots-Tag ci-dessous.

location / {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    # Sans cet en-tête, Flask croit servir en http derrière le proxy : le
    # canonical et og:url sortiraient en http://test.colibre.fr/..., c'est-à-dire
    # vers des URLs qui redirigent. `ProxyFix(x_proto=1)` dans src/app.py le lit.
    # `X-Forwarded-Host` n'est volontairement PAS posé : `Host $host` suffit, et
    # ProxyFix est configuré avec x_host=0 pour ne pas faire confiance à un
    # en-tête que le client pourrait forger.
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:__PORT_TEST__;
    client_max_body_size 100M;
    # Filet de sécurité contre l'indexation de l'instance de test, qui
    # concurrencerait colibre.fr avec du contenu dupliqué. L'application le fait
    # déjà quand DEVELOPMENT=true (robots.txt en Disallow et meta robots
    # noindex, voir `_build_robots_txt` et META_TAGS dans src/app.py), mais cela
    # dépend d'une variable d'environnement qui peut être absente ou mal
    # positionnée sur le serveur. Cet en-tête, lui, ne dépend de rien.
    # `always` pour qu'il soit posé aussi sur les réponses d'erreur.
    add_header X-Robots-Tag "noindex, nofollow" always;
    # Pas de `add_header Link ... rel="canonical"` ici, contrairement à ce que
    # portait la conf de production avant #128 : le canonical est servi par
    # l'application, et `$uri` ne contient pas la query string — un en-tête posé
    # ici contredirait le HTML sur chaque page paginée (`?page=N`).
    add_header Access-Control-Allow-Origin *;
}

error_page 500 502 503 504 /5xx.html;

location = /5xx.html {
    root __CHEMIN_APP_TEST__/src/assets;
    internal;
}
